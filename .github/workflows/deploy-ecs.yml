name: deploy-ecs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
    steps:
      - name: Check deployment secrets
        id: gate
        run: |
          if [ -z "$ECS_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ECS_HOST secret 未配置,跳过部署(配置 ECS_HOST/ECS_USER/ECS_SSH_KEY 后自动生效)。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.gate.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_SSH_PORT || 22 }}
          command_timeout: 55m
          script: |
            set -e
            if [ ! -d /opt/voyant/app/.git ]; then
              command -v git >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y git; }
              sudo mkdir -p /opt/voyant
              sudo git clone https://github.com/${{ github.repository }}.git /opt/voyant/app \
                || sudo git clone https://ghproxy.net/https://github.com/${{ github.repository }}.git /opt/voyant/app
            else
              # 先把部署脚本本身更新到最新 main,再执行(bootstrap 内部不拉代码)
              sudo -iu voyant git -C /opt/voyant/app fetch origin main || true
              sudo -iu voyant git -C /opt/voyant/app reset --hard origin/main || true
            fi
            sudo APP_HOST='${{ secrets.ECS_HOST }}' bash /opt/voyant/app/deploy/ecs/bootstrap.sh
